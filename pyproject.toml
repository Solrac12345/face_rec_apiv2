# EN: Ruff linting config (updated for v0.3+ syntax)
# FR-CA: Configuration de linting Ruff (mise à jour pour syntaxe v0.3+)
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# EN: Enable these rule categories
# FR-CA: Activer ces catégories de règles
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# EN: Ignore line-length (handled by formatter)
# FR-CA: Ignorer la longueur de ligne (gérée par le formateur)
ignore = ["E501"]
# EN: FastAPI-specific patterns that are intentional, not bugs
# FR-CA: Patterns FastAPI spécifiques qui sont intentionnels, pas des bugs
extend-ignore = [
    "B008",  # Depends/Security/File in defaults is standard FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]           # Allow unused imports in __init__
"app/auth.py" = ["B008"]           # FastAPI auth dependency patterns
"app/routes/*.py" = ["B008"]       # FastAPI route dependency patterns  
"app/main.py" = ["B008"]           # FastAPI app factory patterns
"tests/**/*.py" = ["S101", "S105"] # Allow asserts & hardcoded test values

[tool.pytest.ini_options]
asyncio_mode = "auto"  # ✅ Auto mode works reliably with 0.21.2
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--verbose",
    "--cov=app",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]